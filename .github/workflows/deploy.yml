name: Auto Deploy to Coolify

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Coolify Deployment
        run: |
          response=$(curl -s -o response.txt -w "%{http_code}" -X POST "https://coolify.ragory.tech/api/v1/deploy?uuid=q84wk80000okcwo04g40g888&force=false")
          echo "HTTP Status: $response"
          cat response.txt